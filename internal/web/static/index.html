<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script nonce="{{NONCE}}">
    try {
      const s = localStorage.getItem('color-scheme');
      if (s === 'light' || s === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = s;
      }
    } catch {}
  </script>
  <title>InstaBox VM Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app"></div>
  <script nonce="{{NONCE}}" type="module" src="/js/app.js"></script>
</body>
</html>
